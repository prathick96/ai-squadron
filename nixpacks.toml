# nixpacks.toml — multi-language build: Python 3.11 + Node 20
#
# [phases.install] is intentionally NOT defined.
# Nixpacks auto-detects Python from .python-version and requirements.txt,
# creates /opt/venv, and runs pip install automatically — overriding that
# phase caused "pip: command not found" because our cmd ran before the
# venv's PATH was activated.
#
# We only add nodejs_20 to setup and handle the npm steps in build phase.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.build]
cmds = [
  "npm --prefix frontend install",
  "npm --prefix frontend run build"
]
