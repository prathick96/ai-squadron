# railway.toml — AI Squadron monorepo config
# Railway documentation: https://docs.railway.app/reference/config-as-code
#
# This file points Railway at the backend/ subdirectory so Railpack/Nixpacks
# can find pyproject.toml and detect the Python project correctly.
# Without this, Railway scans the repo root and finds only subdirectories.

[build]
rootDirectory = "backend"

[deploy]
startCommand = "uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
