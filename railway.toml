# railway.toml — AI Squadron deployment config
# Railway documentation: https://docs.railway.app/reference/config-as-code
#
# DESIGN RATIONALE — why each line is here:
#
# builder = "NIXPACKS"
#   Week 7 added a React frontend build step (Node 20 + npm).
#   Railpack 0.23 only handles Python; Nixpacks handles multi-language builds.
#   nixpacks.toml defines the setup/install/build phases explicitly.
#
# startCommand
#   `python -m uvicorn` instead of bare `uvicorn`: mise's Python bin/ dir is
#   not on PATH in the deploy image, so the uvicorn entry-point script fails.
#   `python -m uvicorn` uses whatever Python is on PATH.
#
#   --loop asyncio: uvloop crashes inside Railway's container seccomp profile.
#   --http h11: httptools is absent (no uvicorn[standard]); h11 is the
#   pure-Python fallback that is always available.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT --loop asyncio --http h11"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
