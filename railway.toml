# railway.toml — AI Squadron deployment config
# Railway documentation: https://docs.railway.app/reference/config-as-code
#
# pyproject.toml lives at the repo root — no rootDirectory needed.
# Non-editable install avoids the editable-install .pth path-baking issue
# that causes "module not found" crashes in Railway's multi-stage builds.

[build]
buildCommand = "pip install '.[api,revenue]'"

[deploy]
startCommand = "python -m uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT --loop asyncio --http h11"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
