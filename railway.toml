# railway.toml — AI Squadron deployment config
# Railway documentation: https://docs.railway.app/reference/config-as-code
#
# DESIGN RATIONALE — why each line is here:
#
# [build] buildCommand
#   Railpack 0.23 does NOT auto-run `pip install .` — buildCommand IS the
#   pip install step.  Without it, Railpack installs only the Python interpreter
#   (via mise) and copies zero packages; runtime gets "No module named X".
#   Non-editable (no -e): packages go directly into site-packages with no .pth
#   path dependency, so they survive unchanged in the runtime image.
#   fastapi, uvicorn, and stripe are in base deps so `pip install .` covers
#   everything without needing extras.
#
# [deploy] startCommand
#   `python -m uvicorn` instead of bare `uvicorn`: mise's Python bin/ dir is
#   not on PATH in the deploy image, so the uvicorn entry-point script fails.
#   `python -m uvicorn` uses whatever Python is on PATH, which always resolves
#   to the interpreter that owns the installed packages.
#
#   --loop asyncio: uvloop (from uvicorn[standard]) crashes inside Railway's
#   container seccomp profile.  We install plain uvicorn (no [standard]) so
#   uvloop is absent, but the flag is kept as an explicit safety net.
#
#   --http h11: httptools (also from uvicorn[standard]) is absent; h11 is the
#   pure-Python fallback that is always available.

[build]
buildCommand = "pip install ."

[deploy]
startCommand = "python -m uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT --loop asyncio --http h11"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
