version: "3.9"

# Local development stack — mirrors production services exactly.
# Run: docker compose up -d
# Stop: docker compose down
# Nuke volumes: docker compose down -v

services:

  postgres:
    image: postgres:16-alpine
    container_name: squadron_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_squadron
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d  # Auto-runs migrations on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_squadron"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: squadron_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis_insight:
    image: redislabs/redisinsight:latest
    container_name: squadron_redis_insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools  # Only starts with: docker compose --profile tools up

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: squadron_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@squadron.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools  # Only starts with: docker compose --profile tools up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
