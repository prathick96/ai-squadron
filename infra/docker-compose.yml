version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: squadron_postgres
    environment:
      POSTGRES_DB: squadron
      POSTGRES_USER: squadron
      POSTGRES_PASSWORD: squadron_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squadron"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: squadron_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: squadron_redis_insight
    ports:
      - "8001:8001"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
